<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>App | Idea Collider</title>
  <link href="https://fonts.googleapis.com/css2?family=Cabinet+Grotesk:wght@400;500;700;800;900&family=Satoshi:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="styles.css">
  <script>
    if (!localStorage.getItem('currentUser')) {
      window.location.href = 'signup.html';
    }
  </script>
  <script src="script.js"></script>
</head>
<body>
  <nav class="navbar custom-navbar navbar-expand-lg">
    <div class="container">
      <a href="index.html" class="nav-brand"><span class="pill-dot"></span> Idea Collider</a>
      <div class="nav-links d-flex align-items-center gap-3" id="navLinks">
        <!-- Injected by nav.js -->
      </div>
    </div>
  </nav>

  <div class="blob blob1"></div>
  <div class="blob blob2"></div>
  <div class="blob blob3"></div>

  <div class="app container py-5 mt-5" style="max-width: 640px;">

    <header class="text-center mb-5">
      <div class="pill-badge mb-3">
        <span class="pill-dot"></span>
        Idea Collider
      </div>
      <h1 class="mb-3">Smash ideas,<br>make <span class="highlight">magic</span></h1>
      <p class="text-muted">Enter two random things. Get 4 wild ideas born from the collision.</p>
      <div class="examples d-flex flex-wrap justify-content-center gap-2 mt-3">
        <span class="ex-chip" onclick="fillExample('sushi','architecture')">sushi + architecture</span>
        <span class="ex-chip" onclick="fillExample('yoga','stock market')">yoga + stock market</span>
        <span class="ex-chip" onclick="fillExample('chess','street food')">chess + street food</span>
        <span class="ex-chip" onclick="fillExample('sleep','social media')">sleep + social media</span>
      </div>
    </header>

    <div class="input-section bg-white p-4 p-md-5 border rounded-4 shadow-sm mb-4">
      <div class="row align-items-end g-3 mb-4">
        <div class="col-12 col-md-5">
          <label class="input-label form-label" for="input1">Thing one</label>
          <input type="text" class="form-control form-control-lg" id="input1" placeholder="e.g. jazz" maxlength="40" />
        </div>
        <div class="col-12 col-md-2 d-flex justify-content-center align-items-center">
          <div class="plus fs-2 fw-bold text-center lh-1" style="width: 48px; height: 48px; border-radius: 12px;">+</div>
        </div>
        <div class="col-12 col-md-5">
          <label class="input-label form-label" for="input2">Thing two</label>
          <input type="text" class="form-control form-control-lg" id="input2" placeholder="e.g. farming" maxlength="40" />
        </div>
      </div>

      <button id="collideBtn" class="btn w-100 py-3" onclick="collide()">
        ⚡ Collide &amp; Create
      </button>
    </div>

    <p class="hint">↩ Press Enter to collide</p>

    <div id="status"></div>
    <div id="results"></div>

  </div>

  <script src="nav.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmxc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
