<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up | Idea Collider</title>
  <link href="https://fonts.googleapis.com/css2?family=Cabinet+Grotesk:wght@400;500;700;800;900&family=Satoshi:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav class="navbar custom-navbar navbar-expand-lg">
    <div class="container">
      <a href="index.html" class="nav-brand"><span class="pill-dot"></span> Idea Collider</a>
      <div class="nav-links d-flex align-items-center gap-3" id="navLinks"></div>
    </div>
  </nav>

  <div class="blob blob1"></div>
  <div class="blob blob2"></div>

  <div class="page-container container d-flex align-items-center justify-content-center" style="min-height: calc(100vh - 80px);">
    <div class="auth-box bg-white p-4 p-md-5 border rounded-4 shadow-sm w-100" style="max-width: 480px;">
      <div class="page-header text-center mb-4">
        <h2 class="fs-2 mb-2">Join us</h2>
        <p class="text-muted">Start colliding ideas today.</p>
      </div>
      
      <form id="signupForm">
        <div class="mb-3">
          <label class="form-label">Name</label>
          <input type="text" id="name" class="form-control form-control-lg" required placeholder="Your name">
        </div>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" id="email" class="form-control form-control-lg" required placeholder="you@example.com">
        </div>
        <div class="mb-4">
          <label class="form-label">Password</label>
          <input type="password" id="password" class="form-control form-control-lg" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn w-100 py-3 auth-btn" style="background: var(--text); color: white; font-weight: 700; border-radius: 12px;">Sign Up</button>
      </form>
      <div class="text-center mt-4 text-muted">
        Already have an account? <a href="login.html" class="text-decoration-none fw-bold" style="color: var(--accent1);">Log in</a>
      </div>
    </div>
  </div>

  <script src="nav.js"></script>
  <script src="auth.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmxc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
